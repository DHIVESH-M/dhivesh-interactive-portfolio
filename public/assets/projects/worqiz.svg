<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="wqBgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stopColor="#0d1b38" />
      <stop offset="60%" stopColor="#080e22" />
      <stop offset="100%" stopColor="#04060f" />
    </radialGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="wqCyanGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00f5ff" />
      <stop offset="50%" stopColor="#10b981" />
      <stop offset="100%" stopColor="#38bdf8" />
    </linearGradient>

    <linearGradient id="wqPurplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8b5cf6" />
      <stop offset="100%" stopColor="#ec4899" />
    </linearGradient>

    <linearGradient id="wqAmberOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fbbf24" />
      <stop offset="100%" stopColor="#f97316" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="wqGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="wqSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmic Canvas -->
  <rect width="800" height="480" fill="url(#wqBgGlow)" rx="20" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="240" r="140" fill="#00f5ff" opacity="0.08" filter="blur(40px)" />
  <circle cx="620" cy="240" r="150" fill="#10b981" opacity="0.08" filter="blur(40px)" />

  <!-- Cybernetic Background Grid -->
  <g opacity="0.15" stroke="#00f5ff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- TOP HEADER DASHBOARD -->
  <rect x="36" y="30" width="728" height="52" rx="14" fill="#0d152d" stroke="rgba(0, 245, 255, 0.35)" stroke-width="1.2" />
  <circle cx="64" cy="56" r="6" fill="#ef4444" />
  <circle cx="84" cy="56" r="6" fill="#f59e0b" />
  <circle cx="104" cy="56" r="6" fill="#10b981" />

  <text x="135" y="61" fill="#ffffff" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="13" font-weight="700" letter-spacing="1">
    WORQIZ <tspan fill="#00f5ff">//</tspan> DECENTRALIZED WORKFORCE &amp; DISPATCH NETWORK
  </text>

  <!-- Live Status Badge -->
  <rect x="580" y="42" width="168" height="28" rx="14" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.2" />
  <circle cx="598" cy="56" r="4" fill="#10b981" filter="url(#wqSoftGlow)" />
  <text x="612" y="60" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">● LIVE DISPATCH V2</text>

  <!-- LEFT PANEL: WORKER PROFILE & ESCROW CONTRACT -->
  <g transform="translate(36, 102)">
    <rect width="345" height="346" rx="18" fill="#0b1226" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1.2" />
    
    <!-- Profile Card Header -->
    <g transform="translate(24, 24)">
      <!-- Avatar with glowing cyber ring -->
      <circle cx="32" cy="32" r="32" fill="url(#wqCyanGreen)" filter="url(#wqSoftGlow)" />
      <circle cx="32" cy="32" r="28" fill="#0b1226" />
      <!-- User silhouette -->
      <circle cx="32" cy="25" r="11" fill="#00f5ff" />
      <path d="M 16 52 C 16 41, 48 41, 48 52 Z" fill="#00f5ff" />

      <!-- Verified badge icon -->
      <circle cx="52" cy="50" r="9" fill="#10b981" />
      <path d="M 48 50 L 51 53 L 57 47" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />

      <text x="76" y="26" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="16" font-weight="800">Skilled Specialist</text>
      <text x="76" y="46" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">UID #0x82f..44a &bull; Top Rated ★ 5.0</text>
    </g>

    <!-- Verified Skill Badges -->
    <g transform="translate(24, 110)">
      <rect x="0" y="0" width="90" height="26" rx="6" fill="rgba(0, 245, 255, 0.15)" stroke="#00f5ff" stroke-width="1" />
      <text x="14" y="17" fill="#00f5ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">JAVA CORE</text>

      <rect x="100" y="0" width="96" height="26" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
      <text x="111" y="17" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">SYSTEM ARCH</text>

      <rect x="206" y="0" width="86" height="26" rx="6" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1" />
      <text x="219" y="17" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">SQL ENGINE</text>
    </g>

    <!-- Smart Escrow Milestone Box -->
    <g transform="translate(24, 160)">
      <rect width="297" height="96" rx="12" fill="#070b1a" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="16" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="0.5">SMART CONTRACT ESCROW</text>
      <text x="238" y="24" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">LOCKED</text>

      <text x="16" y="48" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="13" font-weight="700">Milestone: Dispatch Verification</text>

      <!-- Progress Track -->
      <rect x="16" y="62" width="265" height="12" rx="6" fill="#1e293b" />
      <rect x="16" y="62" width="225" height="12" rx="6" fill="url(#wqCyanGreen)" filter="url(#wqSoftGlow)" />
      <text x="245" y="86" fill="#00f5ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">85%</text>
    </g>

    <!-- Instant Wage Payout Button -->
    <g transform="translate(24, 276)">
      <rect width="297" height="46" rx="12" fill="url(#wqCyanGreen)" filter="url(#wqSoftGlow)" />
      <text x="75" y="28" fill="#050814" font-family="'Poppins', sans-serif" font-size="13" font-weight="800" letter-spacing="0.5">
        ⚡ Instant Wage Settlement
      </text>
    </g>
  </g>

  <!-- RIGHT PANEL: DECENTRALIZED MULTI-SIDED DISPATCH MATRIX -->
  <g transform="translate(400, 102)">
    <rect width="364" height="346" rx="18" fill="#0b1226" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.2" />

    <text x="24" y="34" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="15" font-weight="800">
      Decentralized Proximity Graph
    </text>
    <text x="24" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">
      TRIANGULAR USER DISPATCH ENGINE
    </text>

    <!-- Network Topology Graph -->
    <g transform="translate(182, 195)">
      <!-- Radar Sonar Pulse Rings -->
      <circle cx="0" cy="0" r="115" fill="none" stroke="rgba(0, 245, 255, 0.15)" stroke-width="1.2" stroke-dasharray="4 6" />
      <circle cx="0" cy="0" r="80" fill="none" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" />
      <circle cx="0" cy="0" r="45" fill="none" stroke="rgba(0, 245, 255, 0.35)" stroke-width="1.5" />

      <!-- Connecting Tri-Mesh Links -->
      <line x1="0" y1="0" x2="-100" y2="-60" stroke="#00f5ff" stroke-width="2.5" filter="url(#wqSoftGlow)" />
      <line x1="0" y1="0" x2="100" y2="-50" stroke="#10b981" stroke-width="2.5" filter="url(#wqSoftGlow)" />
      <line x1="0" y1="0" x2="0" y2="85" stroke="#fbbf24" stroke-width="2.5" filter="url(#wqSoftGlow)" />
      <line x1="-100" y1="-60" x2="100" y2="-50" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" stroke-dasharray="5 5" />
      <line x1="100" y1="-50" x2="0" y2="85" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" stroke-dasharray="5 5" />
      <line x1="0" y1="85" x2="-100" y2="-60" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" stroke-dasharray="5 5" />

      <!-- Center Hub: WORQIZ Smart Dispatcher -->
      <circle cx="0" cy="0" r="34" fill="url(#wqCyanGreen)" filter="url(#wqGlow)" />
      <circle cx="0" cy="0" r="28" fill="#090e1e" />
      <circle cx="0" cy="0" r="14" fill="#00f5ff" filter="url(#wqSoftGlow)" />
      <text x="0" y="4" fill="#090e1e" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" text-anchor="middle">HUB</text>

      <!-- Node 1: Worker (Top Left) -->
      <g transform="translate(-100, -60)">
        <circle cx="0" cy="0" r="22" fill="#0d1b38" stroke="#00f5ff" stroke-width="2.5" filter="url(#wqSoftGlow)" />
        <circle cx="0" cy="0" r="10" fill="#00f5ff" />
        <rect x="-35" y="-36" width="70" height="18" rx="4" fill="#070b1a" stroke="#00f5ff" stroke-width="1" />
        <text x="0" y="-24" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">WORKER</text>
      </g>

      <!-- Node 2: Merchant / Store (Top Right) -->
      <g transform="translate(100, -50)">
        <circle cx="0" cy="0" r="22" fill="#0d2e24" stroke="#10b981" stroke-width="2.5" filter="url(#wqSoftGlow)" />
        <circle cx="0" cy="0" r="10" fill="#10b981" />
        <rect x="-38" y="-36" width="76" height="18" rx="4" fill="#070b1a" stroke="#10b981" stroke-width="1" />
        <text x="0" y="-24" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">MERCHANT</text>
      </g>

      <!-- Node 3: Local Field Agent (Bottom) -->
      <g transform="translate(0, 85)">
        <circle cx="0" cy="0" r="22" fill="#2d1d08" stroke="#fbbf24" stroke-width="2.5" filter="url(#wqSoftGlow)" />
        <circle cx="0" cy="0" r="10" fill="#fbbf24" />
        <rect x="-32" y="24" width="64" height="18" rx="4" fill="#070b1a" stroke="#fbbf24" stroke-width="1" />
        <text x="0" y="36" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">AGENT</text>
      </g>
    </g>

    <!-- Bottom Status Strip -->
    <g transform="translate(24, 290)">
      <rect width="316" height="36" rx="10" fill="#070b1a" stroke="rgba(0, 245, 255, 0.2)" stroke-width="1" />
      <text x="14" y="22" fill="#00f5ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">
        PROXIMITY: 0.8 KM <tspan fill="#64748b">|</tspan> <tspan fill="#34d399">DISPATCH CONFIRMED</tspan>
      </text>
    </g>
  </g>
</svg>