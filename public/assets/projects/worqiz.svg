<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="wqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#080c1d" />
      <stop offset="50%" stopColor="#0d1430" />
      <stop offset="100%" stopColor="#0b1e36" />
    </linearGradient>
    <linearGradient id="wqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#5b8cff" />
      <stop offset="100%" stopColor="#5be6ff" />
    </linearGradient>
    <filter id="wqGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#wqBg)" rx="18" />

  <!-- Top Title Bar -->
  <rect x="40" y="35" width="720" height="48" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
  <circle cx="65" cy="59" r="6" fill="#5b8cff" />
  <circle cx="85" cy="59" r="6" fill="#5be6ff" />
  <circle cx="105" cy="59" r="6" fill="#10b981" />
  <text x="135" y="64" fill="#f4f5fb" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">WORQIZ // DECENTRALIZED WORKFORCE &amp; TASK MATCHING</text>
  <rect x="585" y="45" width="155" height="28" rx="14" fill="rgba(91,140,255,0.2)" stroke="#5b8cff" />
  <text x="605" y="63" fill="#5be6ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">● MATCHING PEERS</text>

  <!-- Left: Worker Profile & Escrow Smart Contract Card -->
  <rect x="40" y="110" width="330" height="325" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
  <g transform="translate(65, 140)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#wqGrad)" />
    <circle cx="30" cy="24" r="12" fill="#080c1d" />
    <path d="M 12 50 C 12 38, 48 38, 48 50" fill="#080c1d" />

    <text x="75" y="26" fill="#f4f5fb" font-family="'Poppins', sans-serif" font-size="14" font-weight="700">Verified Freelancer</text>
    <text x="75" y="46" fill="#5be6ff" font-family="'JetBrains Mono', monospace" font-size="11">UID #0x82f..44a &bull; Top Rated</text>

    <!-- Verified Skill Badges -->
    <g transform="translate(0, 85)">
      <rect x="0" y="0" width="85" height="26" rx="6" fill="rgba(91,140,255,0.15)" stroke="#5b8cff" />
      <text x="14" y="17" fill="#5be6ff" font-family="'JetBrains Mono', monospace" font-size="10">UI/UX DEV</text>

      <rect x="95" y="0" width="95" height="26" rx="6" fill="rgba(91,230,255,0.15)" stroke="#5be6ff" />
      <text x="108" y="17" fill="#5be6ff" font-family="'JetBrains Mono', monospace" font-size="10">FULL-STACK</text>

      <rect x="200" y="0" width="80" height="26" rx="6" fill="rgba(74,222,128,0.15)" stroke="#4ade80" />
      <text x="214" y="17" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10">AI MODEL</text>
    </g>

    <!-- Escrow Milestone Bar -->
    <g transform="translate(0, 140)">
      <text x="0" y="0" fill="#7d84a6" font-family="'JetBrains Mono', monospace" font-size="10">MILESTONE ESCROW LOCK</text>
      <rect x="0" y="12" width="280" height="10" rx="5" fill="rgba(255,255,255,0.08)" />
      <rect x="0" y="12" width="210" height="10" rx="5" fill="url(#wqGrad)" />
      <text x="0" y="44" fill="#f4f5fb" font-family="'Poppins', sans-serif" font-size="12" font-weight="600">Phase 2: System Integration</text>
      <text x="220" y="44" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">75%</text>
    </g>

    <rect x="0" y="215" width="280" height="38" rx="10" fill="rgba(91,140,255,0.2)" stroke="#5b8cff" />
    <text x="90" y="239" fill="#f4f5fb" font-family="'Poppins', sans-serif" font-size="12" font-weight="700">⚡ Instant Payout</text>
  </g>

  <!-- Right: Decentralized Node Mesh (Employer to Worker Coordination) -->
  <rect x="390" y="110" width="370" height="325" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
  <text x="420" y="145" fill="#f4f5fb" font-family="'Poppins', sans-serif" font-size="15" font-weight="700">Decentralized Micro-Task Network</text>

  <!-- Network Graph -->
  <g transform="translate(420, 175)">
    <!-- Connections -->
    <line x1="60" y1="60" x2="160" y2="40" stroke="#5b8cff" stroke-width="2" />
    <line x1="60" y1="60" x2="160" y2="130" stroke="#5be6ff" stroke-width="2" />
    <line x1="160" y1="40" x2="260" y2="70" stroke="#9b6bff" stroke-width="2" />
    <line x1="160" y1="130" x2="260" y2="70" stroke="#5b8cff" stroke-width="2" />
    <line x1="160" y1="130" x2="220" y2="190" stroke="#4ade80" stroke-width="2" />

    <!-- Nodes -->
    <circle cx="60" cy="60" r="22" fill="#080c1d" stroke="#5b8cff" stroke-width="3" filter="url(#wqGlow)" />
    <text x="60" y="64" fill="#5be6ff" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">CLIENT</text>

    <circle cx="160" cy="40" r="18" fill="#080c1d" stroke="#9b6bff" stroke-width="2" />
    <text x="160" y="44" fill="#b7bcd6" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">SMART</text>

    <circle cx="160" cy="130" r="24" fill="#080c1d" stroke="#5be6ff" stroke-width="3" filter="url(#wqGlow)" />
    <text x="160" y="134" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">MATCH</text>

    <circle cx="260" cy="70" r="24" fill="url(#wqGrad)" filter="url(#wqGlow)" />
    <text x="260" y="74" fill="#080c1d" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" text-anchor="middle">DEV</text>

    <circle cx="220" cy="190" r="18" fill="#080c1d" stroke="#4ade80" stroke-width="2" />
    <text x="220" y="194" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">PAY</text>
  </g>
</svg>
