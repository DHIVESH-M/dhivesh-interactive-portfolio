<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="spBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#080b1a" />
      <stop offset="50%" stopColor="#0c122e" />
      <stop offset="100%" stopColor="#140f32" />
    </linearGradient>
    <linearGradient id="spGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#5b8cff" />
      <stop offset="50%" stopColor="#9b6bff" />
      <stop offset="100%" stopColor="#ff6bd6" />
    </linearGradient>
    <filter id="spGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#spBg)" rx="18" />
  
  <!-- Grid Matrix -->
  <g opacity="0.12" stroke="#5b8cff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Top Dashboard Bar -->
  <rect x="40" y="35" width="720" height="48" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
  <circle cx="65" cy="59" r="6" fill="#ff5b5b" />
  <circle cx="85" cy="59" r="6" fill="#f59e0b" />
  <circle cx="105" cy="59" r="6" fill="#10b981" />
  <text x="135" y="64" fill="#f4f5fb" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">SKILLPATH AI // ADAPTIVE LEARNING ROADMAP ENGINE</text>
  <rect x="610" y="45" width="130" height="28" rx="14" fill="rgba(91,140,255,0.2)" stroke="#5b8cff" />
  <text x="635" y="63" fill="#5be6ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">● LIVE INFERENCE</text>

  <!-- Left Panel: Skill Gap Curve & Radar -->
  <rect x="40" y="105" width="310" height="330" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" />
  <text x="65" y="135" fill="#9b6bff" font-family="'Poppins', sans-serif" font-size="14" font-weight="700">Market Skill Gap Distribution</text>
  <path d="M 65 240 Q 120 160 170 210 T 260 150 T 320 220" fill="none" stroke="url(#spGrad)" stroke-width="4" filter="url(#spGlow)" />
  <path d="M 65 240 Q 120 160 170 210 T 260 150 T 320 220 L 320 280 L 65 280 Z" fill="url(#spGrad)" opacity="0.1" />
  
  <!-- Metric boxes -->
  <rect x="65" y="305" width="120" height="55" rx="8" fill="rgba(255,255,255,0.05)" />
  <text x="80" y="325" fill="#7d84a6" font-family="'JetBrains Mono', monospace" font-size="10">GAP DEFICIT</text>
  <text x="80" y="348" fill="#5be6ff" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800">-24.8%</text>

  <rect x="205" y="305" width="120" height="55" rx="8" fill="rgba(255,255,255,0.05)" />
  <text x="220" y="325" fill="#7d84a6" font-family="'JetBrains Mono', monospace" font-size="10">MATCH RATE</text>
  <text x="220" y="348" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800">92.4%</text>

  <rect x="65" y="375" width="260" height="42" rx="8" fill="rgba(155,107,255,0.15)" stroke="rgba(155,107,255,0.3)" />
  <text x="95" y="401" fill="#f4f5fb" font-family="'Poppins', sans-serif" font-size="12" font-weight="600">🎯 Career Goal: Machine Learning Engineer</text>

  <!-- Right Panel: Branching Adaptive Roadmap Graph -->
  <rect x="375" y="105" width="385" height="330" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" />
  <text x="405" y="135" fill="#5b8cff" font-family="'Poppins', sans-serif" font-size="14" font-weight="700">Personalized Knowledge Trajectory</text>

  <!-- Roadmap Tree Connections -->
  <path d="M 440 220 L 520 180 L 620 180" stroke="#5b8cff" stroke-width="2.5" stroke-dasharray="4 4" fill="none" />
  <path d="M 440 220 L 520 280 L 620 280" stroke="#9b6bff" stroke-width="2.5" fill="none" />
  <path d="M 620 180 L 710 230" stroke="#ff6bd6" stroke-width="2.5" fill="none" />
  <path d="M 620 280 L 710 230" stroke="#ff6bd6" stroke-width="2.5" fill="none" />

  <!-- Node 1: Foundations -->
  <circle cx="440" cy="220" r="26" fill="#0c1024" stroke="#5b8cff" stroke-width="3" filter="url(#spGlow)" />
  <text x="440" y="225" fill="#f4f5fb" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">PYTHON</text>

  <!-- Node 2: Math / Tensors -->
  <circle cx="520" cy="180" r="22" fill="#0c1024" stroke="#5b8cff" stroke-width="2" />
  <text x="520" y="184" fill="#b7bcd6" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">LINEAR ALG</text>

  <!-- Node 3: Deep Models -->
  <circle cx="520" cy="280" r="24" fill="#0c1024" stroke="#9b6bff" stroke-width="3" filter="url(#spGlow)" />
  <text x="520" y="284" fill="#5be6ff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">PYTORCH</text>

  <!-- Node 4: NLP / LLM -->
  <circle cx="620" cy="180" r="24" fill="#0c1024" stroke="#9b6bff" stroke-width="2" />
  <text x="620" y="184" fill="#b7bcd6" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">TRANSFORM</text>

  <!-- Node 5: Reinforcement Learning -->
  <circle cx="620" cy="280" r="24" fill="#0c1024" stroke="#ff6bd6" stroke-width="2" />
  <text x="620" y="284" fill="#b7bcd6" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">AGENT RL</text>

  <!-- Destination Target -->
  <circle cx="710" cy="230" r="30" fill="url(#spGrad)" filter="url(#spGlow)" />
  <text x="710" y="235" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" text-anchor="middle">AI LEAD</text>
  <circle cx="710" cy="230" r="38" fill="none" stroke="#ff6bd6" stroke-width="1.5" stroke-dasharray="3 3" />
</svg>
