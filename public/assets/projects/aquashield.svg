<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="aqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#06121e" />
      <stop offset="60%" stopColor="#072033" />
      <stop offset="100%" stopColor="#0b384a" />
    </linearGradient>
    <linearGradient id="aqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00f0ff" />
      <stop offset="100%" stopColor="#38bdf8" />
    </linearGradient>
    <filter id="aqGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#aqBg)" rx="18" />

  <!-- Top Title Bar -->
  <rect x="40" y="35" width="720" height="48" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
  <circle cx="65" cy="59" r="6" fill="#00f0ff" />
  <circle cx="85" cy="59" r="6" fill="#38bdf8" />
  <circle cx="105" cy="59" r="6" fill="#10b981" />
  <text x="135" y="64" fill="#f4f5fb" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">AQUASHIELD // IOT MICROPLASTIC FILTRATION &amp; TELEMETRY</text>
  <rect x="580" y="45" width="160" height="28" rx="14" fill="rgba(0,240,255,0.2)" stroke="#00f0ff" />
  <text x="598" y="63" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">● ESP32 STREAMING</text>

  <!-- Left: Multi-Stage Filter Chambers Schematic -->
  <rect x="40" y="110" width="340" height="325" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
  <text x="65" y="145" fill="#38bdf8" font-family="'Poppins', sans-serif" font-size="14" font-weight="700">Multi-Stage Filtration Core</text>

  <g transform="translate(65, 170)">
    <!-- Stage 1: Coarse Mesh -->
    <rect x="0" y="0" width="75" height="150" rx="8" fill="rgba(255,255,255,0.05)" stroke="#0284c7" stroke-width="2" />
    <line x1="15" y1="20" x2="60" y2="20" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />
    <line x1="15" y1="50" x2="60" y2="50" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />
    <line x1="15" y1="80" x2="60" y2="80" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />
    <line x1="15" y1="110" x2="60" y2="110" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />
    <text x="37" y="140" fill="#7d84a6" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">500µm</text>

    <!-- Arrow 1 -->
    <path d="M 85 75 L 105 75" stroke="#00f0ff" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Stage 2: Fine Microfiber Barrier -->
    <rect x="110" y="0" width="75" height="150" rx="8" fill="rgba(0,240,255,0.08)" stroke="#00f0ff" stroke-width="2" filter="url(#aqGlow)" />
    <line x1="120" y1="20" x2="175" y2="20" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="1 2" />
    <line x1="120" y1="40" x2="175" y2="40" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="1 2" />
    <line x1="120" y1="60" x2="175" y2="60" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="1 2" />
    <line x1="120" y1="80" x2="175" y2="80" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="1 2" />
    <line x1="120" y1="100" x2="175" y2="100" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="1 2" />
    <text x="147" y="140" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">50µm FIBER</text>

    <!-- Arrow 2 -->
    <path d="M 195 75 L 215 75" stroke="#00f0ff" stroke-width="2" />

    <!-- Stage 3: Clean Effluent -->
    <rect x="220" y="0" width="75" height="150" rx="8" fill="rgba(74,222,128,0.08)" stroke="#4ade80" stroke-width="2" />
    <path d="M 235 60 Q 257 45 280 60 T 290 60" stroke="#4ade80" stroke-width="2" fill="none" />
    <path d="M 235 90 Q 257 75 280 90 T 290 90" stroke="#4ade80" stroke-width="2" fill="none" />
    <text x="257" y="140" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">PURIFIED</text>

    <!-- Microfiber trapped count -->
    <rect x="0" y="180" width="295" height="45" rx="8" fill="rgba(255,255,255,0.05)" />
    <text x="15" y="208" fill="#f4f5fb" font-family="'JetBrains Mono', monospace" font-size="12">Microplastics Captured: 98.4%</text>
  </g>

  <!-- Right: IoT Telemetry & Sensor Dials -->
  <rect x="405" y="110" width="355" height="325" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
  <text x="430" y="145" fill="#f4f5fb" font-family="'Poppins', sans-serif" font-size="15" font-weight="700">Live Hardware Telemetry</text>

  <!-- Circular Dials -->
  <g transform="translate(485, 220)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="6" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#00f0ff" stroke-width="6" stroke-dasharray="210 280" filter="url(#aqGlow)" />
    <text x="0" y="6" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" text-anchor="middle">7.2</text>
    <text x="0" y="65" fill="#7d84a6" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">pH LEVEL</text>
  </g>

  <g transform="translate(635, 220)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="6" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#4ade80" stroke-width="6" stroke-dasharray="240 280" filter="url(#aqGlow)" />
    <text x="0" y="6" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" text-anchor="middle">18 NTU</text>
    <text x="0" y="65" fill="#7d84a6" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">TURBIDITY</text>
  </g>

  <!-- Telemetry Graph -->
  <g transform="translate(430, 310)">
    <rect x="0" y="0" width="305" height="95" rx="10" fill="rgba(255,255,255,0.04)" />
    <path d="M 20 60 Q 60 30 100 55 T 180 40 T 260 25 T 285 35" fill="none" stroke="url(#aqGrad)" stroke-width="2.5" />
    <text x="15" y="22" fill="#7d84a6" font-family="'JetBrains Mono', monospace" font-size="9">FLOW RATE SENSOR (L/MIN)</text>
    <text x="240" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">4.8 L/m</text>
  </g>
</svg>
