<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="nvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#081412" />
      <stop offset="50%" stopColor="#0d241c" />
      <stop offset="100%" stopColor="#091f2c" />
    </linearGradient>
    <linearGradient id="nvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4ade80" />
      <stop offset="50%" stopColor="#22c55e" />
      <stop offset="100%" stopColor="#5be6ff" />
    </linearGradient>
    <filter id="nvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#nvBg)" rx="18" />

  <!-- Top Title Bar -->
  <rect x="40" y="35" width="720" height="48" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
  <circle cx="65" cy="59" r="6" fill="#4ade80" />
  <circle cx="85" cy="59" r="6" fill="#22c55e" />
  <circle cx="105" cy="59" r="6" fill="#5be6ff" />
  <text x="135" y="64" fill="#f4f5fb" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">NAMMA OORU VIVASAI // DIRECT-TO-FARMER MARKETPLACE</text>
  <rect x="585" y="45" width="155" height="28" rx="14" fill="rgba(74,222,128,0.2)" stroke="#4ade80" />
  <text x="605" y="63" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">● 0% MIDDLEMAN</text>

  <!-- Left: Agricultural Topo Map & Crop Pricing Network -->
  <rect x="40" y="110" width="340" height="325" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
  <text x="65" y="145" fill="#4ade80" font-family="'Poppins', sans-serif" font-size="14" font-weight="700">Rural Aggregation Map</text>

  <!-- Topographic Contour Lines -->
  <g opacity="0.3" stroke="#22c55e" stroke-width="1.5" fill="none">
    <path d="M 60 220 Q 120 180 180 230 T 300 210 T 360 260" />
    <path d="M 60 260 Q 140 220 220 270 T 340 250" />
    <path d="M 60 300 Q 160 260 240 310 T 360 290" />
  </g>

  <!-- Farmer Node -->
  <g transform="translate(110, 240)">
    <circle cx="0" cy="0" r="28" fill="#081412" stroke="#4ade80" stroke-width="3" filter="url(#nvGlow)" />
    <!-- Sprout Icon -->
    <path d="M 0 10 L 0 -12 Q -12 -12 -10 0 Z" fill="#4ade80" />
    <path d="M 0 -2 Q 12 -12 10 0 Z" fill="#22c55e" />
    <text x="0" y="42" fill="#f4f5fb" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">FARMER</text>
    <text x="0" y="55" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">POLLACHI HUB</text>
  </g>

  <!-- Direct Route Arrow -->
  <path d="M 145 240 L 255 240" stroke="url(#nvGrad)" stroke-width="4" stroke-dasharray="6 4" />

  <!-- Urban Consumer Node -->
  <g transform="translate(290, 240)">
    <circle cx="0" cy="0" r="28" fill="#081412" stroke="#5be6ff" stroke-width="3" filter="url(#nvGlow)" />
    <!-- Cart / Store -->
    <rect x="-10" y="-8" width="20" height="16" rx="4" fill="none" stroke="#5be6ff" stroke-width="2" />
    <circle cx="-5" cy="11" r="3" fill="#5be6ff" />
    <circle cx="5" cy="11" r="3" fill="#5be6ff" />
    <text x="0" y="42" fill="#f4f5fb" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">BUYER</text>
    <text x="0" y="55" fill="#5be6ff" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">DIRECT TRADE</text>
  </g>

  <rect x="65" y="360" width="290" height="48" rx="8" fill="rgba(74,222,128,0.15)" stroke="rgba(74,222,128,0.3)" />
  <text x="80" y="388" fill="#f4f5fb" font-family="'Poppins', sans-serif" font-size="12" font-weight="600">🌾 Fair Commodity Pricing Locked</text>

  <!-- Right: Crop Telemetry & Live Pricing Cards -->
  <rect x="405" y="110" width="355" height="325" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
  <text x="430" y="145" fill="#f4f5fb" font-family="'Poppins', sans-serif" font-size="15" font-weight="700">Daily Regional Mandi Pricing</text>

  <!-- Crop 1: Coconut -->
  <g transform="translate(430, 175)">
    <rect x="0" y="0" width="305" height="60" rx="10" fill="rgba(255,255,255,0.04)" />
    <circle cx="30" cy="30" r="18" fill="rgba(74,222,128,0.15)" />
    <text x="30" y="35" fill="#4ade80" font-family="'Poppins', sans-serif" font-size="14" text-anchor="middle">🥥</text>
    <text x="60" y="26" fill="#f4f5fb" font-family="'Poppins', sans-serif" font-size="13" font-weight="700">Pollachi Coconut</text>
    <text x="60" y="44" fill="#7d84a6" font-family="'JetBrains Mono', monospace" font-size="10">Direct Farmer Quote</text>
    <text x="245" y="35" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800">₹32/pc</text>
  </g>

  <!-- Crop 2: Organic Tomato -->
  <g transform="translate(430, 250)">
    <rect x="0" y="0" width="305" height="60" rx="10" fill="rgba(255,255,255,0.04)" />
    <circle cx="30" cy="30" r="18" fill="rgba(255,91,91,0.15)" />
    <text x="30" y="35" fill="#ff5b5b" font-family="'Poppins', sans-serif" font-size="14" text-anchor="middle">🍅</text>
    <text x="60" y="26" fill="#f4f5fb" font-family="'Poppins', sans-serif" font-size="13" font-weight="700">Organic Tomato</text>
    <text x="60" y="44" fill="#7d84a6" font-family="'JetBrains Mono', monospace" font-size="10">Fresh Harvest Lot</text>
    <text x="245" y="35" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800">₹24/kg</text>
  </g>

  <!-- Crop 3: Sugarcane -->
  <g transform="translate(430, 325)">
    <rect x="0" y="0" width="305" height="60" rx="10" fill="rgba(255,255,255,0.04)" />
    <circle cx="30" cy="30" r="18" fill="rgba(91,230,255,0.15)" />
    <text x="30" y="35" fill="#5be6ff" font-family="'Poppins', sans-serif" font-size="14" text-anchor="middle">🌱</text>
    <text x="60" y="26" fill="#f4f5fb" font-family="'Poppins', sans-serif" font-size="13" font-weight="700">Sugarcane Extract</text>
    <text x="60" y="44" fill="#7d84a6" font-family="'JetBrains Mono', monospace" font-size="10">Wholesale Volume</text>
    <text x="235" y="35" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800">₹3,100/t</text>
  </g>
</svg>
