<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="upBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#080b1a" />
      <stop offset="50%" stopColor="#0f142e" />
      <stop offset="100%" stopColor="#0c1024" />
    </linearGradient>
    <linearGradient id="upGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#5b8cff" />
      <stop offset="50%" stopColor="#9b6bff" />
      <stop offset="100%" stopColor="#5be6ff" />
    </linearGradient>
    <filter id="upGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#upBg)" rx="18" />

  <!-- Blueprint Wireframe Grid -->
  <g opacity="0.15" stroke="#9b6bff" stroke-width="1" stroke-dasharray="2 4">
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
  </g>

  <!-- Central Schematic Node -->
  <g transform="translate(400, 220)">
    <circle cx="0" cy="0" r="90" fill="none" stroke="rgba(155,107,255,0.25)" stroke-width="2" stroke-dasharray="6 6" />
    <circle cx="0" cy="0" r="65" fill="none" stroke="rgba(91,140,255,0.3)" stroke-width="2" />
    <circle cx="0" cy="0" r="42" fill="url(#upGrad)" opacity="0.2" filter="url(#upGlow)" />

    <!-- Plus / Blueprint Symbol -->
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#5be6ff" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#5be6ff" stroke-width="4" stroke-linecap="round" />

    <text x="0" y="130" fill="#f4f5fb" font-family="'Poppins', sans-serif" font-size="18" font-weight="800" text-anchor="middle">FUTURE INNOVATION SLOT</text>
    <text x="0" y="155" fill="#7d84a6" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">Ready for Next Autonomous Machine Learning Project</text>
  </g>
</svg>
