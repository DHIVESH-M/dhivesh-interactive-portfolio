<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="rsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1a0b0b" />
      <stop offset="50%" stopColor="#250f14" />
      <stop offset="100%" stopColor="#0c1024" />
    </linearGradient>
    <linearGradient id="rsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ff5b5b" />
      <stop offset="50%" stopColor="#ff6bd6" />
      <stop offset="100%" stopColor="#5b8cff" />
    </linearGradient>
    <filter id="rsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#rsBg)" rx="18" />

  <!-- Top Title Bar -->
  <rect x="40" y="35" width="720" height="48" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
  <circle cx="65" cy="59" r="6" fill="#ff5b5b" />
  <circle cx="85" cy="59" r="6" fill="#ff6bd6" />
  <circle cx="105" cy="59" r="6" fill="#5b8cff" />
  <text x="135" y="64" fill="#f4f5fb" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">ROAD SAFETY SOS // ACCIDENT TELEMETRY &amp; EMERGENCY BROADCAST</text>
  <rect x="585" y="45" width="155" height="28" rx="14" fill="rgba(255,91,91,0.2)" stroke="#ff5b5b" />
  <text x="605" y="63" fill="#ff5b5b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">● GPS LINKED</text>

  <!-- Left: Accelerometer G-Force Spike Waveform -->
  <rect x="40" y="110" width="340" height="325" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
  <text x="65" y="145" fill="#ff5b5b" font-family="'Poppins', sans-serif" font-size="14" font-weight="700">3-Axis Impact Sensor Feed</text>

  <g transform="translate(65, 170)">
    <!-- Normal vibration line -->
    <path d="M 0 70 Q 20 65 40 70 T 80 70 T 120 70 L 140 10 L 155 130 L 170 30 L 185 85 L 290 70" fill="none" stroke="url(#rsGrad)" stroke-width="3" filter="url(#rsGlow)" />
    
    <!-- Threshold alert line -->
    <line x1="0" y1="25" x2="290" y2="25" stroke="rgba(255,91,91,0.5)" stroke-width="1.5" stroke-dasharray="3 3" />
    <text x="0" y="18" fill="#ff5b5b" font-family="'JetBrains Mono', monospace" font-size="10">CRASH THRESHOLD (> 4.5G)</text>

    <!-- Impact Marker -->
    <circle cx="140" cy="10" r="6" fill="#ff5b5b" filter="url(#rsGlow)" />
    <text x="155" y="14" fill="#f4f5fb" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">IMPACT SPIKE: 6.2G</text>

    <!-- Metrics -->
    <rect x="0" y="150" width="135" height="50" rx="8" fill="rgba(255,255,255,0.05)" />
    <text x="12" y="170" fill="#7d84a6" font-family="'JetBrains Mono', monospace" font-size="9">COLLISION TILT</text>
    <text x="12" y="190" fill="#ff5b5b" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800">48° ROLL</text>

    <rect x="155" y="150" width="135" height="50" rx="8" fill="rgba(255,255,255,0.05)" />
    <text x="12" y="170" fill="#7d84a6" font-family="'JetBrains Mono', monospace" font-size="9">DISPATCH SPEED</text>
    <text x="12" y="190" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800">&lt; 1.2 SEC</text>
  </g>

  <!-- Right: Emergency GPS Beacon & Broadcast Dispatch -->
  <rect x="405" y="110" width="355" height="325" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
  <text x="430" y="145" fill="#f4f5fb" font-family="'Poppins', sans-serif" font-size="15" font-weight="700">Emergency Dispatch Packet</text>

  <!-- Radar SOS Waves -->
  <g transform="translate(580, 230)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#ff5b5b" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="#ff6bd6" stroke-width="2" opacity="0.7" />
    <circle cx="0" cy="0" r="22" fill="#ff5b5b" filter="url(#rsGlow)" />
    <!-- Beacon Pin -->
    <circle cx="0" cy="0" r="8" fill="#fff" />
  </g>

  <!-- Telemetry Coordinates Box -->
  <g transform="translate(430, 310)">
    <rect x="0" y="0" width="305" height="95" rx="10" fill="rgba(255,91,91,0.12)" stroke="rgba(255,91,91,0.3)" />
    <text x="15" y="24" fill="#f4f5fb" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">BROADCAST PACKET TRANSMITTED</text>
    <text x="15" y="46" fill="#b7bcd6" font-family="'JetBrains Mono', monospace" font-size="11">GPS: 10.6582° N, 77.0094° E</text>
    <text x="15" y="66" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10">Alert delivered to Nearest Trauma Hub (3.2km)</text>
    <text x="15" y="82" fill="#5be6ff" font-family="'JetBrains Mono', monospace" font-size="10">Family SOS SMS broadcasted via GSM node</text>
  </g>
</svg>
